buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        // Play 는 2026-08-31 부터 신규 업로드에 targetSdk 36(Android 16)을 요구한다
        //  (2026-09-06 실측: 35 로 올리면 커밋 단계에서 "Target SDK of artifact is too low" 403).
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2") // FCM(@react-native-firebase) — google-services.json 처리
    }
}

apply plugin: "com.facebook.react.rootproject"

